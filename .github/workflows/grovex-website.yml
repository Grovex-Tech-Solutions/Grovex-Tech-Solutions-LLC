name: Grovex website build

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/grovex-website.yml"
  pull_request:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/grovex-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grovex-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static website artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: grovex-website-out
          path: website/out
          if-no-files-found: error
